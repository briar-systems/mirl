name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      runners:
        description: runners to build on, as a JSON array, e.g. ["macos-15", "windows-latest"]
        type: string
      profile:
        description: build profile
        type: string
        default: debug
  workflow_call:
    inputs:
      runners:
        type: string
      profile:
        type: string
        default: debug

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MACH_VERSION: 7.0.0-rc.1
  PROFILE: ${{ inputs.profile || 'debug' }}

jobs:
  build:
    name: build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: install mach
        run: |
          url="https://raw.githubusercontent.com/briar-systems/mach/v$MACH_VERSION/dist"
          if [ "$RUNNER_OS" = Windows ]; then
            export MACH_INSTALL_DIR="$(cygpath -w "$RUNNER_TEMP/mach")"
            pwsh -NoProfile -Command "irm $url/install.ps1 | iex"
          else
            export MACH_INSTALL_DIR="$RUNNER_TEMP/mach"
            curl -fsSL "$url/install.sh" | sh
          fi
          echo "$MACH_INSTALL_DIR" >> "$GITHUB_PATH"
      - run: mach --version
      - run: mach dep pull .
      # mirl chooses only masc, and takes the rest from masc's own gitlinks
      - name: mink, std, yaml, deflate and zstd match masc's pins
        run: |
          fail=0
          for dep in mink std yaml deflate zstd; do
            ours=$(git ls-tree HEAD "dep/$dep" | awk '{print $3}')
            theirs=$(git -C dep/masc ls-tree HEAD "dep/$dep" | awk '{print $3}')
            if [ -z "$ours" ] || [ "$ours" != "$theirs" ]; then
              echo "::error::dep/$dep is ${ours:-unpinned} but dep/masc pins ${theirs:-nothing}"
              fail=1
            fi
          done
          exit $fail
      - if: strategy.job-index == 0
        run: mach fmt --check .
      - run: mach build . --all -p "$PROFILE"

  gate:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - run: exit ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 1 || 0 }}
