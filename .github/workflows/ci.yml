name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      runners:
        description: runners to build on, as a JSON array, e.g. ["macos-15", "windows-latest"]
        type: string
      profile:
        description: build profile
        type: string
        default: debug
  workflow_call:
    inputs:
      runners:
        type: string
      profile:
        type: string
        default: debug

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # the mach commit mirl builds with, bumped on purpose
  MACH_REF: c124fb8c24d2cafd040bf4b1432a6b120b179c70
  PROFILE: ${{ inputs.profile || 'debug' }}

jobs:
  build:
    name: build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      # mirl builds with the mach commit MACH_REF names, through that commit's own
      # bootstrap chain, so mach alone owns how it is seeded
      - name: restore built mach
        id: mach
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/mach
          key: mach-${{ runner.os }}-${{ runner.arch }}-${{ env.MACH_REF }}
      - id: src
        if: steps.mach.outputs.cache-hit != 'true'
        env:
          MACH_REF: ${{ env.MACH_REF }}
        run: |
          src=$RUNNER_TEMP/mach-src
          rm -rf "$src"
          git init --quiet "$src"
          git -C "$src" remote add origin https://github.com/briar-systems/mach
          git -C "$src" fetch --quiet --depth 1 origin "$MACH_REF"
          git -C "$src" checkout --quiet FETCH_HEAD
          if command -v sha256sum >/dev/null; then
            chain=$(sha256sum < "$src/.github/bootstrap-chain" | awk '{print $1}')
          else
            chain=$(shasum -a 256 < "$src/.github/bootstrap-chain" | awk '{print $1}')
          fi
          echo "chain=$chain" >> "$GITHUB_OUTPUT"
      - id: chain
        if: steps.mach.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/chain
          key: chain-${{ runner.os }}-${{ runner.arch }}-${{ steps.src.outputs.chain }}
          restore-keys: |
            chain-${{ runner.os }}-${{ runner.arch }}-
      - name: build mach at MACH_REF
        if: steps.mach.outputs.cache-hit != 'true'
        run: |
          exe=
          [ "$RUNNER_OS" = Windows ] && exe=.exe
          (cd "$RUNNER_TEMP/mach-src" && GITHUB_ENV="$RUNNER_TEMP/mach.env" bash .github/scripts/bootstrap.sh)
          mkdir -p "$RUNNER_TEMP/mach"
          cp "$(sed -n 's/^MACH=//p' "$RUNNER_TEMP/mach.env" | tail -n 1)" "$RUNNER_TEMP/mach/mach$exe"
      - if: steps.mach.outputs.cache-hit != 'true' && steps.chain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/chain
          key: chain-${{ runner.os }}-${{ runner.arch }}-${{ steps.src.outputs.chain }}
      - if: steps.mach.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/mach
          key: mach-${{ runner.os }}-${{ runner.arch }}-${{ env.MACH_REF }}
      - name: put built mach on PATH
        run: echo "$RUNNER_TEMP/mach" >> "$GITHUB_PATH"
      - run: mach dep pull .
      # mirl chooses only masc, and takes the rest from masc's own gitlinks
      - name: mink, std, yaml, deflate and zstd match masc's pins
        run: |
          fail=0
          for dep in mink std yaml deflate zstd; do
            ours=$(git ls-tree HEAD "dep/$dep" | awk '{print $3}')
            theirs=$(git -C dep/masc ls-tree HEAD "dep/$dep" | awk '{print $3}')
            if [ -z "$ours" ] || [ "$ours" != "$theirs" ]; then
              echo "::error::dep/$dep is ${ours:-unpinned} but dep/masc pins ${theirs:-nothing}"
              fail=1
            fi
          done
          exit $fail
      - if: strategy.job-index == 0
        run: mach fmt --check .
      - run: mach build . --all -p "$PROFILE"

  gate:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - run: exit ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 1 || 0 }}
