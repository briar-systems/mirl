name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      runners:
        description: runners to test on, as a JSON array, e.g. ["macos-15", "windows-latest"]
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MACH_VERSION: 6.10.1
  # the mach commit mirl builds with, bumped on purpose
  MACH_REF: 5470b803eecb044d3c907419a97a54dcee51993b

jobs:
  # every runner builds every artifact for every target and tests the ones it can run
  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      # mirl builds with the mach commit MACH_REF names, not the dev branch: until a
      # 7.x release exists, the released seed cannot read its manifest keys
      - name: restore built mach
        id: mach-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mach
          key: mach-${{ runner.os }}-${{ env.MACH_REF }}
      - name: install seed mach
        if: steps.mach-cache.outputs.cache-hit != 'true'
        run: |
          export MACH_INSTALL_DIR="$RUNNER_TEMP/seed"
          url="https://raw.githubusercontent.com/briar-systems/mach/v$MACH_VERSION/dist"
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command "irm $url/install.ps1 | iex"
          else
            curl -fsSL "$url/install.sh" | sh
          fi
      - name: fetch mach at MACH_REF
        if: steps.mach-cache.outputs.cache-hit != 'true'
        run: |
          git init --quiet "$RUNNER_TEMP/mach-src"
          cd "$RUNNER_TEMP/mach-src"
          git remote add origin https://github.com/briar-systems/mach
          git fetch --quiet --depth 1 origin "$MACH_REF"
          git checkout --quiet FETCH_HEAD
      - name: build mach at MACH_REF
        if: steps.mach-cache.outputs.cache-hit != 'true'
        run: |
          exe=
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          mkdir -p "$RUNNER_TEMP/mach"
          (cd "$RUNNER_TEMP/mach-src" && bash .github/scripts/seed-build.sh "$RUNNER_TEMP/seed/mach$exe" "$RUNNER_TEMP/mach/mach$exe")
      - name: put built mach on PATH
        run: echo "$RUNNER_TEMP/mach" >> "$GITHUB_PATH"
      - run: mach dep pull .
      - if: strategy.job-index == 0
        run: mach fmt --check .
      - run: mach test . --all

  gate:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: exit ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 1 || 0 }}
