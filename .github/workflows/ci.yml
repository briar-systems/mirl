name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      runners:
        description: runners to test on, as a JSON array, e.g. ["macos-15", "windows-latest"]
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # the mach commit mirl builds with, bumped on purpose
  MACH_REF: 6b2b0788eb5066461c958e97e72889f5cf2e97cd

jobs:
  # the [target.*] names in mach.toml, as the JSON array the test matrix reads
  targets:
    name: targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        run: |
          names=$(sed -n 's/^\[target\.\([^].]*\)\][[:space:]]*$/\1/p' mach.toml)
          if [ -z "$names" ]; then echo "mach.toml has no [target.*]" >&2; exit 1; fi
          list=$(printf '%s\n' "$names" | sed 's/.*/"&"/' | paste -sd, -)
          echo "list=[$list]" >> "$GITHUB_OUTPUT"

  # every runner builds every artifact for every target and tests the ones it can run
  test:
    name: test (${{ matrix.runner }}, ${{ matrix.target }})
    needs: [targets]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '["ubuntu-latest"]') }}
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      # mirl builds with the mach commit MACH_REF names, through that commit's own
      # bootstrap chain, so mach alone owns how it is seeded
      - name: restore built mach
        id: mach-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mach
          key: mach-${{ runner.os }}-${{ runner.arch }}-${{ env.MACH_REF }}
      - name: fetch mach at MACH_REF
        if: steps.mach-cache.outputs.cache-hit != 'true'
        run: |
          git init --quiet "$RUNNER_TEMP/mach-src"
          cd "$RUNNER_TEMP/mach-src"
          git remote add origin https://github.com/briar-systems/mach
          git fetch --quiet --depth 1 origin "$MACH_REF"
          git checkout --quiet FETCH_HEAD
      - name: build mach at MACH_REF
        if: steps.mach-cache.outputs.cache-hit != 'true'
        run: |
          exe=
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          cd "$RUNNER_TEMP/mach-src"
          bash .github/scripts/bootstrap.sh
          mkdir -p "$RUNNER_TEMP/mach"
          cp "b$exe" "$RUNNER_TEMP/mach/mach$exe"
      - name: put built mach on PATH
        run: echo "$RUNNER_TEMP/mach" >> "$GITHUB_PATH"
      - run: mach dep pull .
      # mirl chooses only masc, and takes mink and std from masc's own gitlinks
      - name: mink and std match masc's pins
        if: strategy.job-index == 0
        run: |
          fail=0
          for dep in mink std; do
            ours=$(git ls-tree HEAD "dep/$dep" | awk '{print $3}')
            theirs=$(git -C dep/masc ls-tree HEAD "dep/$dep" | awk '{print $3}')
            if [ -z "$ours" ] || [ "$ours" != "$theirs" ]; then
              echo "::error::dep/$dep is ${ours:-unpinned} but dep/masc pins ${theirs:-nothing}"
              fail=1
            fi
          done
          exit $fail
      - if: strategy.job-index == 0
        run: mach fmt --check .
      - run: mach test . --all -t ${{ matrix.target }} --allow-unrunnable

  gate:
    if: always()
    needs: [targets, test]
    runs-on: ubuntu-latest
    steps:
      - run: exit ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 1 || 0 }}
