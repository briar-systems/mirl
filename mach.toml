[project]
id = "mirl"
version = "0.1.0"
mach = "^6"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-aarch64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.windows-x86_64]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

# the library, what a dependent's `use mirl;` binds
[artifact.mirl]
kind = "static"
default = true
export = true
entry = "lib/mirl.mach"
out = "{project.work}/lib/mirl"
targets = ["*"]
link = ["kernel32"]
need = []

# the command line over the library
[artifact.cli]
kind = "bin"
entry = "bin/mirl.mach"
out = "{project.work}/bin/mirl{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

[link.kernel32]
source = "system"
name = "kernel32.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"
skip = ["vectorize"]

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "commit/36aabc0bf579832f3c27a9a0bffcafe67ac0bad9"

[dep.mink]
git = "https://github.com/briar-systems/mink"
ref = "commit/044ce56425ffa7f5771cd82badf50115be3906ef"

[dep.masc]
git = "https://github.com/briar-systems/masc"
ref = "commit/743098f3a865a5e5b576a8a8518b677d0dc25284"
