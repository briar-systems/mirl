[project]
id = "mirl"
version = "0.1.0"
mach = "^6"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-aarch64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.windows-x86_64]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

# the library, what a dependent's `use mirl;` binds
[artifact.mirl]
kind = "static"
default = true
export = true
entry = "lib/mirl.mach"
out = "{project.work}/lib/mirl"
targets = ["*"]
link = ["kernel32"]
need = []

# the command line over the library
[artifact.cli]
kind = "bin"
entry = "bin/mirl.mach"
out = "{project.work}/bin/mirl{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

[link.kernel32]
source = "system"
name = "kernel32.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"
skip = ["vectorize"]

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "commit/b199f238720029c1f3dbb5b206d05208c189403c"

[dep.mink]
git = "https://github.com/briar-systems/mink"
ref = "commit/bdfb667e59a3de4e7d4b909f4cc89c8995dddb54"

[dep.masc]
git = "https://github.com/briar-systems/masc"
ref = "commit/20573d7484519bd1ffbc54f162c7581161b8c24f"
