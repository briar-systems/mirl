[project]
id = "mirl"
version = "0.1.0"
mach = "^6.10"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-aarch64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.windows-x86_64]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

# the library, what a dependent's `use mirl;` binds
[artifact.mirl]
kind = "static"
default = true
entry = "lib/mirl.mach"
out = "lib/mirl"
targets = ["*"]
link = ["kernel32"]
need = []

# the command line over the library
[artifact.cli]
kind = "bin"
entry = "bin/mirl.mach"
out = "bin/mirl{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

[link.kernel32]
source = "system"
name = "kernel32.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^9.5"

[dep.mink]
git = "https://github.com/briar-systems/mink"
ref = "commit/e5b7f20d38a5501f522d796b7b9cbb81f88dbd07"
